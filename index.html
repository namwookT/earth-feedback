<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>수행평가 피드백 확인</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand" id="brand"><b>지구시스템과학</b> 수행평가 피드백</div>
    <div id="topActions" class="hidden">
      <button class="btn small" id="btnPw" type="button">비밀번호 변경</button>
      <button class="btn small" id="btnLogout" type="button">로그아웃</button>
    </div>
  </div>

  <!-- 로그인 -->
  <section id="viewLogin" class="card login">
    <h1>내 피드백 확인하기</h1>
    <p class="sub">학번과 비밀번호를 입력하세요.</p>
    <form id="loginForm" autocomplete="off">
      <label for="sid">학번</label>
      <input id="sid" type="text" inputmode="numeric" maxlength="10" placeholder="학번 숫자 (예: 2학년 3반 5번 → 20305)" required>
      <label for="pw">비밀번호</label>
      <input id="pw" type="password" maxlength="40" placeholder="선생님께 받은 비밀번호" required>
      <button class="btn primary" type="submit" id="btnLogin">확인하기</button>
      <div class="msg err" id="loginMsg" role="alert"></div>
    </form>
    <p class="hint">처음 비밀번호는 선생님이 개별로 알려 준 번호예요. 5번 틀리면 15분 동안 로그인이 잠겨요.
      공용 컴퓨터에서는 다 본 뒤 꼭 로그아웃하세요.</p>
  </section>

  <!-- 피드백 -->
  <main id="viewFeedback" class="hidden" aria-live="polite"></main>

  <div class="foot">이 페이지의 내용은 본인만 볼 수 있어요. 다른 사람에게 비밀번호를 알려 주지 마세요.</div>
</div>

<!-- 비밀번호 변경 -->
<div class="modal hidden" id="pwModal" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
  <div class="sheet">
    <h2 id="pwTitle">비밀번호 변경</h2>
    <form id="pwForm" autocomplete="off">
      <label for="pwOld">현재 비밀번호</label><input id="pwOld" type="password" maxlength="40" required>
      <label for="pwNew">새 비밀번호 (6자 이상)</label><input id="pwNew" type="password" maxlength="40" minlength="6" required>
      <label for="pwNew2">새 비밀번호 확인</label><input id="pwNew2" type="password" maxlength="40" required>
      <div class="msg" id="pwMsg" role="alert"></div>
      <div class="row2">
        <button class="btn" type="button" id="pwCancel">닫기</button>
        <button class="btn primary" type="submit">변경</button>
      </div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="student.js"></script>
</body>
</html>
